name: tests

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # oldest supported Python
            python: "3.8"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install windows-curses (Windows only)
        if: runner.os == 'Windows'
        run: python -m pip install windows-curses
      - name: Compile the game
        run: python -m py_compile "cool tower defense game.exe.py"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
